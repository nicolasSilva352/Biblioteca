<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-100 to-purple-200">

  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-indigo-700">Nova Conta</h1>
      <p class="text-gray-500 mt-2">Junte-se à Biblioteca</p>
    </div>

    <form [formGroup]="cadastroForm" (ngSubmit)="onSubmit()" class="space-y-5">

      <div>
        <label class="block text-sm font-medium text-gray-700">Nome Completo</label>
        <input type="text" formControlName="nome" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors" placeholder="João da Silva">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">E-mail (Login)</label>
        <input type="email" formControlName="login" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors" placeholder="joao@email.com">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Senha</label>
        <input type="password" formControlName="senha" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors" placeholder="••••••••">
      </div>

      @if (erroCadastro) {
        <div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm text-center">
          Erro ao criar conta. Verifique os dados.
        </div>
      }

      <button type="submit" [disabled]="cadastroForm.invalid" class="w-full bg-indigo-600 text-white font-semibold py-3 px-4 rounded-lg hover:bg-indigo-700 transition-all disabled:opacity-50">
        Cadastrar
      </button>

    </form>

    <div class="mt-6 text-center">
      <a routerLink="/login" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">
        Voltar para o Login
      </a>
    </div>
  </div>
</div>
