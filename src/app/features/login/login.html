<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-100 to-indigo-200">

  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-indigo-700">Biblioteca</h1>
      <p class="text-gray-500 mt-2">Faça login para acessar o acervo</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">

      <div>
        <label class="block text-sm font-medium text-gray-700">Usuário</label>
        <input
          type="text"
          formControlName="login"
          class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors"
          placeholder="ex: nicolas.admin"
        >
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Senha</label>
        <input
          type="password"
          formControlName="senha"
          class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors"
          placeholder="••••••••"
        >
      </div>

      @if (erroLogin) {
        <div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm text-center">
          Credenciais inválidas. Tente novamente!
        </div>
      }

      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="w-full bg-indigo-600 text-white font-semibold py-3 px-4 rounded-lg hover:bg-indigo-700 focus:ring-4 focus:ring-indigo-300 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
        Entrar
      </button>


    </form>

    <p class="mt-6 text-center text-sm text-gray-600">
      Não tem uma conta?
      <a routerLink="/cadastro" class="font-medium text-indigo-600 hover:text-indigo-500 cursor-pointer">
        Cadastre-se
      </a>
    </p>
  </div>

</div>
